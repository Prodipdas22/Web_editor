<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Editor V2 — College Lab Assignment Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @media print {
      body > *:not(#reportPrintArea) { display:none !important; }
      #reportPrintArea { display:block !important; position:static !important; }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">&lt;/&gt;</div>
        <div>
          <strong>Index Editor <span>V2</span></strong>
          <small>College Lab Assignment Builder</small>
        </div>
      </div>

      <div class="top-actions">
        <span id="saveStatus" class="save-status">● Saved</span>
        <button id="saveBtn" class="btn">Save</button>
        <button id="downloadBtn" class="btn">HTML</button>
        <button id="pdfBtn" class="btn primary">Report / PDF</button>
        <button id="themeBtn" class="icon-btn" title="Toggle theme">☾</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div>
            <h2>Experiments</h2>
            <small id="experimentCount">1 experiment</small>
          </div>
          <button id="addExperimentBtn" class="square-btn" title="Add experiment">+</button>
        </div>

        <div class="search-wrap">
          <input id="experimentSearch" type="search" placeholder="Search experiments...">
        </div>

        <div id="experimentList" class="experiment-list"></div>

        <div class="sidebar-bottom">
          <button id="duplicateBtn" class="btn full">Duplicate</button>
          <button id="deleteBtn" class="btn danger full">Delete</button>
        </div>
      </aside>

      <section class="workspace">
        <div class="experiment-bar">
          <div class="details">
            <div class="field compact">
              <label>Experiment No.</label>
              <input id="expNumber" type="text" placeholder="01">
            </div>
            <div class="field title-field">
              <label>Experiment Title</label>
              <input id="expTitle" type="text" placeholder="Enter experiment title">
            </div>
          </div>
          <div class="workspace-actions">
            <button id="previewDesktopBtn" class="btn active">Desktop</button>
            <button id="previewMobileBtn" class="btn">Mobile</button>
            <button id="runBtn" class="btn primary">▶ Run</button>
          </div>
        </div>

        <div class="meta-grid">
          <div class="field">
            <label>Objective</label>
            <textarea id="expObjective" rows="3" placeholder="Write the objective of this experiment..."></textarea>
          </div>
          <div class="field">
            <label>Result</label>
            <textarea id="expResult" rows="3" placeholder="Write the result / conclusion of this experiment..."></textarea>
          </div>
        </div>

        <div class="workbench">
          <section class="panel editor-panel">
            <div class="panel-head">
              <div class="tabs">
                <button class="tab active" data-lang="html">HTML</button>
                <button class="tab" data-lang="css">CSS</button>
                <button class="tab" data-lang="js">JavaScript</button>
              </div>
              <div class="panel-tools">
                <button id="copyCodeBtn" class="mini-btn">Copy</button>
                <button id="formatBtn" class="mini-btn">Format</button>
              </div>
            </div>

            <div class="editor-wrap">
              <div id="lineNumbers" class="line-numbers">1</div>
              <textarea id="codeEditor" spellcheck="false" autocomplete="off"></textarea>
            </div>

            <div class="editor-footer">
              <span id="languageLabel">HTML</span>
              <span>Ctrl/Cmd + Enter = Run</span>
            </div>
          </section>

          <section class="panel preview-panel">
            <div class="panel-head">
              <div>
                <strong>Live Preview</strong>
                <small>Rendered experiment output</small>
              </div>
              <div class="panel-tools">
                <button id="refreshPreviewBtn" class="mini-btn">↻ Refresh</button>
                <button id="fullscreenBtn" class="mini-btn">⛶</button>
              </div>
            </div>

            <div id="previewStage" class="preview-stage desktop-preview">
              <div class="browser-window">
                <div class="browser-bar">
                  <div class="traffic"><i></i><i></i><i></i></div>
                  <div class="address">index-editor://preview</div>
                  <div></div>
                </div>
                <iframe id="previewFrame" title="Live preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
              </div>
            </div>
          </section>
        </div>

        <section class="panel console-panel">
          <div class="panel-head">
            <div>
              <strong>Console</strong>
              <small id="consoleStatus">Ready</small>
            </div>
            <button id="clearConsoleBtn" class="mini-btn">Clear</button>
          </div>
          <div id="consoleOutput" class="console-output">
            <div class="console-line muted">Console ready.</div>
          </div>
        </section>
      </section>
    </main>

    <nav class="mobile-nav">
      <button data-mobile="files">☰<span>Files</span></button>
      <button data-mobile="code" class="active">⌨<span>Code</span></button>
      <button data-mobile="preview">▣<span>Preview</span></button>
      <button data-mobile="console">▤<span>Console</span></button>
    </nav>
  </div>

  <!-- REPORT PREVIEW -->
  <div id="reportModal" class="modal hidden">
    <div class="modal-topbar">
      <div>
        <strong>Lab Record Preview</strong>
        <small>A4-ready • one report for all experiments</small>
      </div>
      <div class="modal-actions">
        <button id="refreshReportBtn" class="btn">Refresh</button>
        <button id="printPdfBtn" class="btn primary">Print / Save PDF</button>
        <button id="closeReportBtn" class="btn">Close</button>
      </div>
    </div>
    <div id="reportScroll" class="report-scroll">
      <div id="reportPages" class="report-pages"></div>
    </div>
  </div>

  <!-- Print-only report container -->
  <div id="reportPrintArea"></div>

  <input id="projectImport" type="file" accept=".json" hidden>

  <script src="script.js"></script>
</body>
</html>
